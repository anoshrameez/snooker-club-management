<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CueMaster Snooker Club — Reception Counter Access & POS</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#FACC15',
              green: '#22C55E',
              red: '#EF4444',
              blue: '#38BDF8',
              bg: '#F8F9FA',
              dark: '#111827'
            }
          },
          fontFamily: {
            sans: ['Space Grotesk', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'brutal': '4px 4px 0px 0px #000000',
            'brutal-sm': '2px 2px 0px 0px #000000',
            'brutal-lg': '6px 6px 0px 0px #000000',
            'brutal-xl': '8px 8px 0px 0px #000000',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- React 18 & Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #F8F9FA;
      color: #111827;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-brutal {
      border: 2px solid #000;
      box-shadow: 4px 4px 0px 0px #000;
      transition: all 0.1s ease;
      font-weight: 700;
    }
    .btn-brutal:hover {
      box-shadow: 2px 2px 0px 0px #000;
      transform: translate(2px, 2px);
    }
    .btn-brutal:active {
      box-shadow: 0px 0px 0px 0px #000;
      transform: translate(4px, 4px);
    }
    .card-brutal {
      background: #FFFFFF;
      border: 2px solid #000;
      box-shadow: 4px 4px 0px 0px #000;
    }
    .badge-brutal {
      border: 2px solid #000;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .input-brutal {
      border: 2px solid #000;
      background: #FFFFFF;
      font-weight: 500;
      transition: all 0.15s;
    }
    .input-brutal:focus {
      outline: none;
      box-shadow: 3px 3px 0px 0px #000;
    }
    @media print {
      body * {
        visibility: hidden !important;
      }
      #thermal-receipt-area, #thermal-receipt-area * {
        visibility: visible !important;
      }
      #thermal-receipt-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        margin: 0;
        padding: 8px;
      }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-yellow-300 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // REAL-TIME MULTI-DEVICE CLOUD SYNC ENDPOINTS (HIGH-SPEED DUAL-REDUNDANT ARCHITECTURE)
    const SYNC_ENDPOINTS = [
      'https://extendsclass.com/api/json-storage/bin/bcdcceb',
      'https://extendsclass.com/api/json-storage/bin/dcaebea'
    ];

    // REAL INITIAL DATA (CLEAN ZERO DEMO SESSIONS / CUSTOMERS)
    const DEFAULT_TABLES = [
      { id: 1, name: "Table 1 (Standard)", type: "standard", rate_century: 10, rate_6ball: 130, rate_10ball: 150, rate_oneball: 120, status: "available", session: null },
      { id: 2, name: "Table 2 (Standard)", type: "standard", rate_century: 10, rate_6ball: 130, rate_10ball: 150, rate_oneball: 120, status: "available", session: null },
      { id: 3, name: "Table 3 (Standard)", type: "standard", rate_century: 10, rate_6ball: 130, rate_10ball: 150, rate_oneball: 120, status: "available", session: null },
      { id: 4, name: "Table 4 (Standard)", type: "standard", rate_century: 10, rate_6ball: 130, rate_10ball: 150, rate_oneball: 120, status: "available", session: null },
      { id: 5, name: "Table 5 (VIP)", type: "vip", rate_century: 12, rate_6ball: 150, rate_10ball: 180, rate_oneball: 140, status: "available", session: null },
      { id: 6, name: "Table 6 (Tournament VIP)", type: "vip", rate_century: 15, rate_6ball: 160, rate_10ball: 200, rate_oneball: 150, status: "available", session: null },
    ];

    const DEFAULT_USERS = [
      { id: 1, username: "admin", password: "admin123", role: "admin", name: "Manager Admin", is_active: true },
      { id: 2, username: "staff", password: "staff123", role: "staff", name: "Reception Staff", is_active: true },
    ];

    const DEFAULT_SETTINGS = {
      club_name: "CueMaster Snooker Club",
      tagline: "Reception Counter Access",
      address: "Gulberg III, Main Boulevard, Lahore, Pakistan",
      phone: "+92 300 1234567",
      currency: "Rs.",
      timezone: "Asia/Karachi",
      default_century: 10,
      default_6ball: 130,
      default_10ball: 150,
      default_oneball: 120,
    };

    function getStore(k, fallback) {
      try {
        const item = localStorage.getItem(k);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function setStore(k, v) {
      try {
        localStorage.setItem(k, JSON.stringify(v));
      } catch (e) {}
    }

    // ==========================================
    // MAIN APP WITH REAL-TIME CLOUD SYNC
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(() => getStore('cm_auth_user', null));
      const [tables, setTables] = useState(() => getStore('cm_tables', DEFAULT_TABLES));
      const [users, setUsers] = useState(() => getStore('cm_users', DEFAULT_USERS));
      const [settings, setSettings] = useState(() => getStore('cm_settings', DEFAULT_SETTINGS));
      const [customers, setCustomers] = useState(() => getStore('cm_customers', []));
      const [sessions, setSessions] = useState(() => getStore('cm_sessions', []));

      const [activeTab, setActiveTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [checkoutData, setCheckoutData] = useState(null);
      const [receiptData, setReceiptData] = useState(null);
      const [newSessionModalOpen, setNewSessionModalOpen] = useState(false);
      const [selectedTableForModal, setSelectedTableForModal] = useState(null);
      const [cloudSyncStatus, setCloudSyncStatus] = useState('synced'); // 'synced', 'syncing', 'offline'
      const [lastSyncTime, setLastSyncTime] = useState(null);

      const versionRef = useRef(getStore('cm_version', 0));
      const lastUpdatedRef = useRef(getStore('cm_updatedAt', 0));
      const isPushingRef = useRef(false);

      // --- MULTI-DEVICE CLOUD SYNC ENGINE ---
      const pushToCloud = async (newTables, newSessions, newCustomers) => {
        try {
          setCloudSyncStatus('syncing');
          const currentTables = newTables || tables;
          const currentSessions = newSessions || sessions;
          const currentCustomers = newCustomers || customers;

          const nextVersion = (Number(versionRef.current) || 0) + 1;
          const timestamp = Date.now();
          versionRef.current = nextVersion;
          lastUpdatedRef.current = timestamp;

          // Local persistence backup
          setStore('cm_tables', currentTables);
          setStore('cm_sessions', currentSessions);
          setStore('cm_customers', currentCustomers);
          setStore('cm_version', nextVersion);
          setStore('cm_updatedAt', timestamp);

          const payload = {
            version: nextVersion,
            updatedAt: timestamp,
            tables: currentTables,
            sessions: currentSessions,
            customers: currentCustomers
          };

          const bodyStr = JSON.stringify(payload);

          // Push to primary endpoint
          const res = await fetch(SYNC_ENDPOINTS[0], {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: bodyStr
          });

          // Mirror asynchronously to secondary backup endpoint
          fetch(SYNC_ENDPOINTS[1], {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: bodyStr
          }).catch(() => {});

          if (res.ok) {
            setCloudSyncStatus('synced');
            setLastSyncTime(new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Karachi', hour12: false }));
          } else {
            setCloudSyncStatus('offline');
          }
        } catch (err) {
          console.warn('Cloud sync push error:', err);
          setCloudSyncStatus('offline');
        }
      };

      const pullFromCloud = async () => {
        for (const endpoint of SYNC_ENDPOINTS) {
          try {
            const res = await fetch(`${endpoint}?_cb=${Date.now()}`, {
              cache: 'no-store',
              headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache'
              }
            });
            if (!res.ok) continue;
            const data = await res.json();
            if (data && Array.isArray(data.tables)) {
              const cloudVersion = Number(data.version) || 0;
              const cloudTimestamp = Number(data.updatedAt) || 0;

              const shouldApply = (versionRef.current === 0) ||
                                  (cloudVersion > versionRef.current) ||
                                  (cloudVersion === versionRef.current && cloudTimestamp > lastUpdatedRef.current);

              if (shouldApply) {
                versionRef.current = cloudVersion;
                lastUpdatedRef.current = cloudTimestamp;

                setTables(data.tables);
                setStore('cm_tables', data.tables);

                if (Array.isArray(data.sessions)) {
                  setSessions(data.sessions);
                  setStore('cm_sessions', data.sessions);
                }
                if (Array.isArray(data.customers)) {
                  setCustomers(data.customers);
                  setStore('cm_customers', data.customers);
                }
                setStore('cm_version', cloudVersion);
                setStore('cm_updatedAt', cloudTimestamp);
              }
              setCloudSyncStatus('synced');
              setLastSyncTime(new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Karachi', hour12: false }));
              return;
            }
          } catch (err) {
            // try next endpoint
          }
        }
        setCloudSyncStatus('offline');
      };

      // Pull from cloud on mount, poll every 1.5 seconds, and sync on tab focus/visibility
      useEffect(() => {
        pullFromCloud();
        const pollInterval = setInterval(pullFromCloud, 1500);

        const handleFocus = () => pullFromCloud();
        const handleVisibility = () => {
          if (!document.hidden) pullFromCloud();
        };
        const handleOnline = () => pullFromCloud();

        window.addEventListener('focus', handleFocus);
        document.addEventListener('visibilitychange', handleVisibility);
        window.addEventListener('online', handleOnline);

        return () => {
          clearInterval(pollInterval);
          window.removeEventListener('focus', handleFocus);
          document.removeEventListener('visibilitychange', handleVisibility);
          window.removeEventListener('online', handleOnline);
        };
      }, []);

      // Local storage mirror
      useEffect(() => { setStore('cm_auth_user', currentUser); }, [currentUser]);
      useEffect(() => { setStore('cm_tables', tables); }, [tables]);
      useEffect(() => { setStore('cm_users', users); }, [users]);
      useEffect(() => { setStore('cm_settings', settings); }, [settings]);
      useEffect(() => { setStore('cm_customers', customers); }, [customers]);
      useEffect(() => { setStore('cm_sessions', sessions); }, [sessions]);

      // PKT Clock
      const [pktDate, setPktDate] = useState('');
      const [pktTime, setPktTime] = useState('');
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setPktDate(now.toLocaleDateString('en-US', { timeZone: 'Asia/Karachi', weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' }));
          setPktTime(now.toLocaleTimeString('en-US', { timeZone: 'Asia/Karachi', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }));
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      const handleLogin = (user) => {
        setCurrentUser(user);
        setActiveTab('dashboard');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('cm_auth_user');
      };

      const handleStartMatch = ({ tableId, customerName, customerPhone, gameType, rateApplied, rounds }) => {
        const targetTable = tables.find(t => t.id === tableId);
        if (targetTable && targetTable.status === 'occupied') {
          alert(`Table "${targetTable.name}" is already in an active session! Another terminal may have just started it.`);
          pullFromCloud();
          return;
        }

        const sessionCode = `SNK-${Date.now().toString().slice(-6)}`;
        let updatedCustomers = [...customers];

        if (customerName && customerName.trim() && customerName !== 'Walk-in Player') {
          const exists = customers.find(c => c.name.toLowerCase() === customerName.trim().toLowerCase());
          if (exists) {
            updatedCustomers = customers.map(c => c.id === exists.id ? { ...c, total_visits: (c.total_visits || 1) + 1 } : c);
          } else {
            updatedCustomers = [{ id: Date.now(), name: customerName.trim(), phone: customerPhone.trim(), notes: 'Counter match', total_visits: 1, total_spent: 0 }, ...customers];
          }
          setCustomers(updatedCustomers);
        }

        const updatedTables = tables.map(t => {
          if (t.id === tableId) {
            return {
              ...t,
              status: 'occupied',
              session: {
                session_code: sessionCode,
                customer_name: customerName || 'Walk-in Player',
                customer_phone: customerPhone || '',
                game_type: gameType,
                rate_applied: rateApplied,
                rounds: rounds,
                start_time: new Date().toISOString(),
                operator: currentUser ? currentUser.name : 'Counter Staff'
              }
            };
          }
          return t;
        });

        setTables(updatedTables);
        setNewSessionModalOpen(false);
        // Sync across mobile and desktop instantly!
        pushToCloud(updatedTables, sessions, updatedCustomers);
      };

      const handleUpdateRounds = (tableId, newRounds) => {
        const updatedTables = tables.map(t => {
          if (t.id === tableId && t.session) {
            return { ...t, session: { ...t.session, rounds: Math.max(1, newRounds) } };
          }
          return t;
        });
        setTables(updatedTables);
        pushToCloud(updatedTables, sessions, customers);
      };

      const handleConfirmSettlement = ({ tableId, tableName, customerName, customerPhone, gameType, rateApplied, rounds, durationSeconds, subtotal, discount, totalPrice, notes, shouldPrint }) => {
        const sessionRecord = {
          id: Date.now(),
          session_code: `SNK-${Date.now().toString().slice(-6)}`,
          table_id: tableId,
          table_name: tableName,
          customer_name: customerName,
          customer_phone: customerPhone,
          game_type: gameType,
          rate_applied: rateApplied,
          rounds: rounds,
          duration_seconds: durationSeconds,
          subtotal: subtotal,
          discount: discount,
          total_price: totalPrice,
          payment_status: 'paid',
          payment_method: 'cash',
          operator: currentUser ? currentUser.name : 'Counter Staff',
          notes: notes,
          start_time: new Date().toLocaleString('en-US', { timeZone: 'Asia/Karachi' })
        };

        const updatedSessions = [sessionRecord, ...sessions];
        setSessions(updatedSessions);

        let updatedCustomers = [...customers];
        if (customerName) {
          updatedCustomers = customers.map(c => c.name.toLowerCase() === customerName.toLowerCase() ? { ...c, total_spent: (c.total_spent || 0) + totalPrice } : c);
          setCustomers(updatedCustomers);
        }

        const updatedTables = tables.map(t => t.id === tableId ? { ...t, status: 'available', session: null } : t);
        setTables(updatedTables);
        setCheckoutData(null);

        if (shouldPrint) {
          setReceiptData(sessionRecord);
        }

        // Broadcast to cloud so mobile and desktop sync in real time!
        pushToCloud(updatedTables, updatedSessions, updatedCustomers);
      };

      // Gated Login Page
      if (!currentUser) {
        return (
          <LoginPage
            settings={settings}
            users={users}
            onLogin={handleLogin}
          />
        );
      }

      // Live metrics
      const activeSessions = tables.filter(t => t.status === 'occupied' && t.session);
      const totalRevenueToday = sessions.reduce((sum, s) => sum + (Number(s.total_price) || 0), 0);
      const totalCenturyMinutes = sessions.filter(s => s.game_type === 'century').reduce((sum, s) => sum + Math.ceil((Number(s.duration_seconds) || 0) / 60), 0);
      const totalFramesCount = sessions.filter(s => s.game_type !== 'century').reduce((sum, s) => sum + (Number(s.rounds) || 0), 0);

      return (
        <div className="min-h-screen flex flex-col md:flex-row antialiased bg-[#F8F9FA]">
          
          {/* MOBILE HEADER */}
          <header className="md:hidden bg-white border-b-2 border-black p-4 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 bg-brand-yellow border-2 border-black flex items-center justify-center font-bold text-sm shadow-brutal-sm">
                🎱
              </div>
              <span className="font-black tracking-tight text-base uppercase">{settings.club_name}</span>
            </div>
            <div className="flex items-center space-x-2">
              <button
                onClick={pullFromCloud}
                title="Tap to refresh state immediately"
                className="flex items-center gap-1.5 px-2 py-1 bg-white border border-black shadow-[2px_2px_0px_0px_#000] text-[10px] font-bold active:translate-y-0.5"
              >
                <span className={`w-2 h-2 rounded-full ${cloudSyncStatus === 'synced' ? 'bg-emerald-500 animate-pulse' : cloudSyncStatus === 'syncing' ? 'bg-amber-500' : 'bg-red-500'}`}></span>
                <i className={`fa-solid fa-arrows-rotate text-[10px] ${cloudSyncStatus === 'syncing' ? 'animate-spin text-amber-600' : 'text-gray-700'}`}></i>
              </button>
              <button
                onClick={() => { setSelectedTableForModal(tables.find(t => t.status === 'available') || tables[0]); setNewSessionModalOpen(true); }}
                className="btn-brutal px-3 py-1 bg-brand-yellow text-xs flex items-center gap-1 font-bold"
              >
                <i className="fa-solid fa-plus text-[10px]"></i>
                <span>NEW</span>
              </button>
              <button
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="p-2 border-2 border-black bg-white hover:bg-gray-100"
              >
                <i className="fa-solid fa-bars"></i>
              </button>
            </div>
          </header>

          {/* SIDEBAR NAVIGATION (DESKTOP & MOBILE TOGGLE) */}
          <aside className={`${mobileMenuOpen ? 'flex' : 'hidden'} md:flex flex-col w-full md:w-64 bg-white border-r-2 border-black shrink-0 min-h-screen sticky top-0 z-30 justify-between`}>
            <div>
              {/* Brand Header */}
              <div className="p-5 border-b-2 border-black bg-white">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 bg-brand-yellow border-2 border-black flex items-center justify-center text-lg font-black shadow-brutal-sm">
                    🎱
                  </div>
                  <div>
                    <h1 className="font-black text-lg tracking-tight uppercase leading-tight">{settings.club_name}</h1>
                    <div className="flex items-center gap-1.5 mt-1">
                      <span className={`w-2 h-2 rounded-full ${cloudSyncStatus === 'synced' ? 'bg-emerald-500 animate-pulse' : cloudSyncStatus === 'syncing' ? 'bg-amber-500' : 'bg-red-500'}`}></span>
                      <p className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">
                        {cloudSyncStatus === 'synced' ? 'Multi-Device Live' : cloudSyncStatus === 'syncing' ? 'Syncing...' : 'Offline'}
                      </p>
                      <button
                        onClick={pullFromCloud}
                        title="Force cloud sync"
                        className="ml-1 text-gray-400 hover:text-black transition"
                      >
                        <i className={`fa-solid fa-arrows-rotate text-[10px] ${cloudSyncStatus === 'syncing' ? 'animate-spin text-amber-500' : ''}`}></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              {/* Action Button: + NEW SESSION */}
              <div className="p-4 border-b-2 border-black bg-gray-50">
                <button
                  onClick={() => { setSelectedTableForModal(tables.find(t => t.status === 'available') || tables[0]); setNewSessionModalOpen(true); setMobileMenuOpen(false); }}
                  className="w-full btn-brutal py-3 px-4 bg-brand-yellow hover:bg-yellow-400 text-black flex items-center justify-center gap-2 text-sm uppercase tracking-wide font-black"
                >
                  <i className="fa-solid fa-circle-plus text-base"></i>
                  <span>+ NEW SESSION</span>
                </button>
              </div>

              {/* Menu Links */}
              <nav className="p-3 space-y-1.5 text-sm font-bold">
                <button
                  onClick={() => { setActiveTab('dashboard'); setMobileMenuOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-none border-2 text-left transition ${
                    activeTab === 'dashboard' ? 'bg-black text-white border-black shadow-brutal-sm' : 'border-transparent text-gray-800 hover:border-black hover:bg-gray-100'
                  }`}
                >
                  <i className="fa-solid fa-chart-pie w-4 text-center"></i>
                  <span>Dashboard</span>
                  {activeSessions.length > 0 && (
                    <span className="ml-auto bg-red-600 text-white text-[10px] font-mono px-1.5 py-0.2 rounded-full animate-pulse">
                      {activeSessions.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => { setActiveTab('history'); setMobileMenuOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-none border-2 text-left transition ${
                    activeTab === 'history' ? 'bg-black text-white border-black shadow-brutal-sm' : 'border-transparent text-gray-800 hover:border-black hover:bg-gray-100'
                  }`}
                >
                  <i className="fa-solid fa-clock-rotate-left w-4 text-center"></i>
                  <span>Sessions History</span>
                </button>

                <button
                  onClick={() => { setActiveTab('customers'); setMobileMenuOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-none border-2 text-left transition ${
                    activeTab === 'customers' ? 'bg-black text-white border-black shadow-brutal-sm' : 'border-transparent text-gray-800 hover:border-black hover:bg-gray-100'
                  }`}
                >
                  <i className="fa-solid fa-users w-4 text-center"></i>
                  <span>Customers</span>
                </button>

                <button
                  onClick={() => { setActiveTab('tables'); setMobileMenuOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-none border-2 text-left transition ${
                    activeTab === 'tables' ? 'bg-black text-white border-black shadow-brutal-sm' : 'border-transparent text-gray-800 hover:border-black hover:bg-gray-100'
                  }`}
                >
                  <i className="fa-solid fa-border-all w-4 text-center"></i>
                  <span>Tables & Rates</span>
                </button>

                <button
                  onClick={() => { setActiveTab('reports'); setMobileMenuOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-none border-2 text-left transition ${
                    activeTab === 'reports' ? 'bg-black text-white border-black shadow-brutal-sm' : 'border-transparent text-gray-800 hover:border-black hover:bg-gray-100'
                  }`}
                >
                  <i className="fa-solid fa-file-invoice-dollar w-4 text-center"></i>
                  <span>Reports</span>
                </button>

                {currentUser.role === 'admin' && (
                  <div className="pt-3">

    // ==========================================
    // TABLE CARD ITEM
    // ==========================================
    function TableCardItem({ table, onStartSession, onEndSession, onUpdateRounds }) {
      const isOccupied = table.status === 'occupied' && table.session;
      const [elapsed, setElapsed] = useState(0);

      useEffect(() => {
        if (!isOccupied || !table.session.start_time) {
          setElapsed(0);
          return;
        }
        const calc = () => {
          const diff = Math.max(0, Math.floor((Date.now() - new Date(table.session.start_time).getTime()) / 1000));
          setElapsed(diff);
        };
        calc();
        const timer = setInterval(calc, 1000);
        return () => clearInterval(timer);
      }, [isOccupied, table.session?.start_time]);

      const formatClock = (s) => {
        const hrs = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return `${hrs.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
      };

      const calculateTotal = () => {
        if (!table.session) return 0;
        const rate = Number(table.session.rate_applied) || 10;
        if (table.session.game_type === 'century') {
          return Math.max(1, Math.ceil(elapsed / 60)) * rate;
        }
        return (Number(table.session.rounds) || 1) * rate;
      };

      return (
        <div className="card-brutal p-5 bg-white flex flex-col justify-between">
          <div>
            {/* Header */}
            <div className="flex items-start justify-between pb-3 border-b-2 border-black">
              <div>
                <h3 className="font-black text-lg uppercase tracking-tight text-gray-950 flex items-center gap-2">
                  <span>{table.name}</span>
                </h3>
                <span className="text-[10px] font-bold uppercase tracking-wider text-gray-500 font-mono">
                  {table.type} Table
                </span>
              </div>
              <span className={`badge-brutal px-2.5 py-1 text-[11px] ${
                isOccupied ? 'bg-red-500 text-white animate-pulse' : 'bg-emerald-400 text-black'
              }`}>
                {isOccupied ? 'In Play' : 'Available'}
              </span>
            </div>

            {/* Rates strip */}
            <div className="py-2.5 border-b border-gray-200 grid grid-cols-4 gap-1 text-[10px] font-bold text-center text-gray-600 uppercase font-mono">
              <div className="bg-gray-100 p-1 border border-gray-300">Cen: {table.rate_century}</div>
              <div className="bg-gray-100 p-1 border border-gray-300">6B: {table.rate_6ball}</div>
              <div className="bg-gray-100 p-1 border border-gray-300">10B: {table.rate_10ball}</div>
              <div className="bg-gray-100 p-1 border border-gray-300">1B: {table.rate_oneball}</div>
            </div>

            {/* Status View */}
            {isOccupied ? (
              <div className="py-4 space-y-3">
                <div className="bg-amber-50 border-2 border-black p-3 text-center">
                  <div className="text-[10px] font-bold uppercase text-gray-500 tracking-wider">Elapsed Time</div>
                  <div className="text-3xl font-black font-mono tracking-wider text-amber-900 mt-0.5">
                    {formatClock(elapsed)}
                  </div>
                  <div className="mt-2 pt-2 border-t border-amber-200 flex justify-between items-center text-xs font-bold">
                    <span className="text-gray-600 uppercase text-[10px]">Current Bill:</span>
                    <span className="font-mono text-base font-black text-black">
                      Rs. {calculateTotal().toLocaleString()}
                    </span>
                  </div>
                </div>

                <div className="space-y-1 text-xs">
                  <div className="flex justify-between">
                    <span className="text-gray-500 font-bold uppercase text-[10px]">Player:</span>
                    <span className="font-black text-gray-900">{table.session.customer_name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-500 font-bold uppercase text-[10px]">Mode:</span>
                    <span className="font-bold uppercase text-amber-800 bg-amber-100 px-1 border border-black">
                      {table.session.game_type}
                    </span>
                  </div>
                  {table.session.game_type !== 'century' && (
                    <div className="flex justify-between items-center pt-1">
                      <span className="text-gray-500 font-bold uppercase text-[10px]">Frames:</span>
                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => onUpdateRounds(table.id, (table.session.rounds || 1) - 1)}
                          className="w-6 h-6 bg-gray-200 hover:bg-gray-300 border border-black font-black text-xs"
                        >-</button>
                        <span className="font-mono font-black text-sm px-1.5">{table.session.rounds || 1}</span>
                        <button
                          onClick={() => onUpdateRounds(table.id, (table.session.rounds || 1) + 1)}
                          className="w-6 h-6 bg-brand-yellow hover:bg-yellow-400 border border-black font-black text-xs"
                        >+</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div className="py-8 text-center text-gray-400 space-y-1">
                <i className="fa-solid fa-circle-check text-2xl text-emerald-500"></i>
                <p className="text-xs font-bold text-gray-600 uppercase">Ready for Players</p>
                <p className="text-[10px] text-gray-400">Click below to start match</p>
              </div>
            )}
          </div>

          {/* Action Button */}
          <div className="pt-3 border-t-2 border-black">
            {isOccupied ? (
              <button
                onClick={() => onEndSession(table, elapsed, calculateTotal())}
                className="w-full btn-brutal py-2.5 bg-red-600 hover:bg-red-500 text-white text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2"
              >
                <i className="fa-solid fa-flag-checkered"></i>
                <span>END SESSION & PAY (Rs. {calculateTotal()})</span>
              </button>
            ) : (
              <button
                onClick={() => onStartSession(table)}
                className="w-full btn-brutal py-2.5 bg-brand-yellow hover:bg-yellow-400 text-black text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2"
              >
                <i className="fa-solid fa-play text-[10px]"></i>
                <span>START MATCH</span>
              </button>
            )}
          </div>
        </div>
      );
    }

    // NEW SESSION MODAL
    // ==========================================
    function NewSessionModal({ table, tables, customers, onClose, onStart }) {
      const defaultTable = (table && table.status === 'available')
        ? table
        : (tables.find(t => t.status === 'available') || tables[0]);
      const [selTableId, setSelTableId] = useState(defaultTable ? defaultTable.id : 1);
      const [gameType, setGameType] = useState('century');
      const [playerName, setPlayerName] = useState('');
      const [playerPhone, setPlayerPhone] = useState('');
      const [rounds, setRounds] = useState(1);

      const currTable = tables.find(t => t.id === Number(selTableId)) || tables[0];
      const getRate = (gt) => {
        if (gt === 'century') return currTable.rate_century || 10;
        if (gt === '6ball') return currTable.rate_6ball || 130;
        if (gt === '10ball') return currTable.rate_10ball || 150;
        return currTable.rate_oneball || 120;
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="card-brutal w-full max-w-lg bg-white p-6 shadow-brutal-xl">
            <div className="flex justify-between items-center pb-3 border-b-2 border-black mb-4">
              <h2 className="text-xl font-black uppercase tracking-tight">🎱 Start New Snooker Match</h2>
              <button onClick={onClose} className="w-7 h-7 bg-black text-white font-bold">✕</button>
            </div>

            <form onSubmit={(e) => {
              e.preventDefault();
              const chosen = tables.find(t => t.id === Number(selTableId));
              if (chosen && chosen.status === 'occupied') {
                alert(`Table "${chosen.name}" is already occupied! Please choose an available table.`);
                return;
              }
              onStart({
                tableId: Number(selTableId),
                customerName: playerName.trim() || 'Walk-in Player',
                customerPhone: playerPhone.trim(),
                gameType: gameType,
                rateApplied: getRate(gameType),
                rounds: gameType === 'century' ? 1 : Number(rounds) || 1
              });
            }} className="space-y-4">
              
              <div>
                <label className="block text-xs font-black uppercase mb-1">Select Table</label>
                <select
                  value={selTableId}
                  onChange={(e) => setSelTableId(e.target.value)}
                  className="w-full input-brutal px-3 py-2 text-sm font-bold"
                >
                  {tables.map(t => (
                    <option key={t.id} value={t.id} disabled={t.status === 'occupied'}>
                      {t.name} ({t.type}) {t.status === 'occupied' ? '— OCCUPIED' : '— AVAILABLE'}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-black uppercase mb-1">Game Mode</label>
                <div className="grid grid-cols-2 gap-2">
                  {[
                    { id: 'century', name: 'Century', sub: `Rs.${currTable.rate_century}/min` },
                    { id: '6ball', name: '6 Ball', sub: `Rs.${currTable.rate_6ball}/frame` },
                    { id: '10ball', name: '10 Ball', sub: `Rs.${currTable.rate_10ball}/frame` },
                    { id: 'oneball', name: 'One Ball', sub: `Rs.${currTable.rate_oneball}/frame` },
                  ].map(g => (
                    <button
                      type="button"
                      key={g.id}
                      onClick={() => setGameType(g.id)}
                      className={`p-2.5 text-left border-2 border-black transition ${
                        gameType === g.id ? 'bg-brand-yellow font-black shadow-brutal-sm' : 'bg-gray-50 font-bold'

    function ReportsLedgerView({ sessions, settings }) {
      const totalCash = sessions.reduce((sum, s) => sum + (Number(s.total_price) || 0), 0);
      const downloadCSV = () => {
        const rows = [['Receipt Code', 'Table', 'Customer', 'Game Type', 'Amount (Rs)', 'Status', 'Date']];
        sessions.forEach(s => rows.push([s.session_code, s.table_name, s.customer_name, s.game_type, s.total_price, s.payment_status, s.start_time]));
        const csv = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(',')).join('\n');
        const a = document.createElement('a');
        a.href = encodeURI(csv);
        a.download = `snooker_shift_report_${Date.now()}.csv`;
        a.click();

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b-2 border-black">

              <p className="text-xs font-bold text-gray-600 uppercase tracking-widest mt-0.5">Cash register reconciliation</p>
            </div>
            <button

            >
              <i className="fa-solid fa-download"></i>

            <div className="card-brutal p-4 bg-white">
              <span className="text-[11px] font-black uppercase text-gray-500">Average Per Match</span>
              <p className="text-3xl font-black font-mono mt-1 text-gray-950">
                Rs. {sessions.length > 0 ? Math.round(totalCash / sessions.length) : 0}
              </p>
              <span className="text-[10px] font-bold text-gray-400 uppercase">Per Session</span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // CLUB SETTINGS VIEW (ADMIN ONLY)
    // ==========================================
    function ClubSettingsView({ settings, onSave }) {
      const [form, setForm] = useState({ ...settings });

      return (
        <div className="space-y-6">
          <div className="pb-2 border-b-2 border-black">
            <h1 className="text-2xl font-black uppercase tracking-tight text-gray-950">System Settings</h1>
            <p className="text-xs font-bold text-gray-600 uppercase tracking-widest mt-0.5">Club branding and global defaults</p>
          </div>

          <form onSubmit={(e) => { e.preventDefault(); onSave(form); }} className="space-y-6">
            <div className="card-brutal p-6 bg-white space-y-4">
              <h2 className="text-sm font-black uppercase border-b-2 border-black pb-2">Branding & Contact</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-black uppercase mb-1">Club Name</label>
                  <input type="text" value={form.club_name} onChange={e => setForm({ ...form, club_name: e.target.value })} className="w-full input-brutal px-3 py-2 text-sm font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-black uppercase mb-1">Contact Phone</label>
                  <input type="text" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} className="w-full input-brutal px-3 py-2 text-sm font-mono" />
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-xs font-black uppercase mb-1">Address</label>
                  <input type="text" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} className="w-full input-brutal px-3 py-2 text-sm" />
                </div>
              </div>
            </div>

            <div className="card-brutal p-6 bg-white space-y-4">
              <h2 className="text-sm font-black uppercase border-b-2 border-black pb-2">Default Rates (PKR)</h2>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                  <label className="block text-xs font-black uppercase mb-1">Century (Rs/min)</label>
                  <input type="number" value={form.default_century} onChange={e => setForm({ ...form, default_century: Number(e.target.value) })} className="w-full input-brutal px-3 py-2 text-sm font-mono font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-black uppercase mb-1">6 Ball (Rs)</label>
                  <input type="number" value={form.default_6ball} onChange={e => setForm({ ...form, default_6ball: Number(e.target.value) })} className="w-full input-brutal px-3 py-2 text-sm font-mono font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-black uppercase mb-1">10 Ball (Rs)</label>
                  <input type="number" value={form.default_10ball} onChange={e => setForm({ ...form, default_10ball: Number(e.target.value) })} className="w-full input-brutal px-3 py-2 text-sm font-mono font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-black uppercase mb-1">One Ball (Rs)</label>
                  <input type="number" value={form.default_oneball} onChange={e => setForm({ ...form, default_oneball: Number(e.target.value) })} className="w-full input-brutal px-3 py-2 text-sm font-mono font-bold" />
                </div>
              </div>
              <button type="submit" className="btn-brutal px-6 py-2.5 bg-brand-yellow font-black text-xs uppercase">Save Settings</button>
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
    // USERS & STAFF MANAGER VIEW (ADMIN ONLY)
    // ==========================================
    function UsersManagerView({ users, onAddUser, onToggleStatus }) {
      const [uName, setUName] = useState('');
      const [uUser, setUUser] = useState('');
      const [uPass, setUPass] = useState('');
      const [uRole, setURole] = useState('staff');

      return (
        <div className="space-y-6">
          <div className="pb-2 border-b-2 border-black">
            <h1 className="text-2xl font-black uppercase tracking-tight text-gray-950">Staff & Users Management</h1>
            <p className="text-xs font-bold text-gray-600 uppercase tracking-widest mt-0.5">Manage operator accounts and permissions</p>
          </div>

          <form onSubmit={(e) => {
            e.preventDefault();
            if (!uUser.trim()) return;
            onAddUser({ id: Date.now(), name: uName.trim() || uUser.trim(), username: uUser.trim(), password: uPass.trim() || 'password123', role: uRole, is_active: true });
            setUName(''); setUUser(''); setUPass('');
          }} className="card-brutal p-5 bg-white space-y-3">
            <h3 className="text-xs font-black uppercase">Create New Staff User</h3>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <input required type="text" placeholder="Full Name" value={uName} onChange={e => setUName(e.target.value)} className="input-brutal px-3 py-2 text-xs font-bold" />
              <input required type="text" placeholder="Username" value={uUser} onChange={e => setUUser(e.target.value)} className="input-brutal px-3 py-2 text-xs font-bold" />
              <input required type="password" placeholder="Password" value={uPass} onChange={e => setUPass(e.target.value)} className="input-brutal px-3 py-2 text-xs" />
              <select value={uRole} onChange={e => setURole(e.target.value)} className="input-brutal px-3 py-2 text-xs font-bold">
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button type="submit" className="btn-brutal px-6 py-2 bg-black text-brand-yellow font-black text-xs uppercase">Add Staff</button>
          </form>

          <div className="card-brutal overflow-x-auto bg-white">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-gray-100 font-black uppercase border-b-2 border-black">
                  <th className="p-3">Name</th>
                  <th className="p-3">Username</th>
                  <th className="p-3">Role</th>
                  <th className="p-3">Status</th>
                  <th className="p-3">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200 font-bold">
                {users.map(u => (
                  <tr key={u.id}>
                    <td className="p-3 font-black">{u.name}</td>
                    <td className="p-3 font-mono">{u.username}</td>
                    <td className="p-3"><span className="badge-brutal px-2 py-0.5 bg-yellow-200">{u.role}</span></td>
                    <td className="p-3">
                      <span className={`badge-brutal px-2 py-0.5 ${u.is_active ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                        {u.is_active ? 'Active' : 'Inactive'}
                      </span>
                    </td>
                    <td className="p-3">
                      {u.username !== 'admin' && (
                        <button onClick={() => onToggleStatus(u.id)} className="text-[11px] underline text-gray-700 hover:text-black">
                          {u.is_active ? 'Deactivate' : 'Activate'}
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
